<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻奢服装电商首页</title>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4.3.0/dist/index.global.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-warm: #f7f5f0;
        --fg: #141413;
        --fg-2: #3d3d3a;
        --muted: #6f6d67;
        --meta: #9b978f;
        --border: #ece7dd;
        --border-soft: #f2ede5;
        --accent: #111111;
        --accent-on: #ffffff;
        --accent-hover: #2a2a28;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: "Helvetica Neue", Arial, sans-serif;
        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 28px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --elev-raised: 0 24px 70px rgba(17, 17, 17, 0.06);
        --tracking-display: -0.03em;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
      }
      * {
        box-sizing: border-box;
      }
      .page {
        background: #fff;
        min-height: 100vh;
      }
      .serif {
        font-family: var(--font-display);
        letter-spacing: var(--tracking-display);
      }
      .text-pretty {
        text-wrap: pretty;
      }
      .grain {
        background-image: radial-gradient(
          rgba(17, 17, 17, 0.03) 0.7px,
          transparent 0.7px
        );
        background-size: 18px 18px;
        opacity: 0.55;
        pointer-events: none;
      }
      .hero-img {
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.16),
            rgba(255, 255, 255, 0)
          ),
          linear-gradient(135deg, #f6f2eb 0%, #efe8de 45%, #ded4c7 100%);
      }
      .fade-up {
        animation: fadeUp 0.8s cubic-bezier(0.2, 0, 0, 1) both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { Section, Text, Button, Card, Carousel } = window;
      const heroSlides = [
        {
          title: "2025 春夏主推",
          description: "轻结构剪裁，克制线条，构成更适合日常与通勤的高级感。",
        },
        {
          title: "真丝与羊毛混纺",
          description: "在柔和质感里保持挺括轮廓，让日常穿着也有仪式感。",
        },
        {
          title: "都市胶囊衣橱",
          description: "以少量高频单品构建完整造型，简洁但不单薄。",
        },
      ];
      const newItems = [
        {
          imgSrc:
            "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "新品连衣裙",
          title: "丝缎垂坠连衣裙",
          description: "适合晚宴与城市约会的轮廓感单品。",
        },
        {
          imgSrc:
            "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "新品套装",
          title: "利落西装套装",
          description: "锋利肩线与柔软面料之间的平衡。",
        },
        {
          imgSrc:
            "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1200&q=80",
          imgAlt: "新品风衣",
          title: "轻量长风衣",
          description: "春季出行的层次感外套，轻薄但有存在感。",
        },
      ];
      const stylingItems = [
        {
          title: "通勤一套",
          description: "衬衫、阔腿裤、低跟鞋，建立干净专业印象。",
        },
        {
          title: "周末松弛",
          description: "针织上衣与直筒裙，留出呼吸感与活动余地。",
        },
        {
          title: "晚间出场",
          description: "缎面上衣搭配深色长裤，强调质地与光泽。",
        },
      ];
      function App() {
        return (
          <div className="page">
            <Section
              columns={22}
              rows={28}
              columnGap={12}
              rowGap={12}
              className="w-full min-h-screen px-3 md:px-5 lg:px-8 py-4 md:py-6"
            >
              <div className="row-start-1 row-end-3 column-start-1 column-end-23 flex items-center justify-between border-b border-[#ece7dd] pb-4 fade-up">
                <Text className="serif text-[22px] md:text-[26px] leading-none">
                  Maison Atelier
                </Text>
                <div className="hidden lg:flex items-center gap-8 text-[14px] text-[#3d3d3a]">
                  <span>女装</span>
                  <span>外套</span>
                  <span>连衣裙</span>
                  <span>鞋履</span>
                  <span>搭配</span>
                </div>
                <Button className="rounded-full bg-[#111111] px-4 py-2 text-[14px] text-white shadow-sm hover:bg-[#2a2a28]">
                  立即选购
                </Button>
              </div>
              <div
                className="row-start-3 row-end-15 column-start-1 column-end-23 grid lg:grid-cols-12 gap-3 md:gap-4 pt-4 fade-up"
                style={{ animationDelay: "80ms" }}
              >
                <div className="lg:col-span-7 rounded-[28px] border border-[#ece7dd] overflow-hidden bg-[#f7f5f0] min-h-[520px] relative">
                  <div className="absolute inset-0 grain"></div>
                  <div className="relative p-7 md:p-10 lg:p-12 h-full flex flex-col justify-between">
                    <div className="max-w-xl">
                      <Text className="uppercase text-[11px] tracking-[0.28em] text-[#9b978f] mb-5">
                        Spring / Summer 2025
                      </Text>
                      <Text className="serif text-[42px] md:text-[58px] lg:text-[68px] leading-[1.02] text-pretty">
                        简洁轮廓，呈现更高级的日常着装
                      </Text>
                      <Text className="mt-6 text-[18px] leading-[1.8] text-[#6f6d67] max-w-lg text-pretty">
                        以克制的版型、柔和的材质和充足留白，建立一套适合现代都市的轻奢衣橱。
                      </Text>
                      <div className="mt-8 flex gap-3">
                        <Button className="rounded-full bg-[#111111] px-5 py-3 text-white">
                          查看新品
                        </Button>
                        <Button className="rounded-full border border-[#ece7dd] bg-white px-5 py-3 text-[#111111]">
                          搭配推荐
                        </Button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-3 max-w-[520px]">
                      {heroSlides.map((item, idx) => (
                        <div
                          key={item.title}
                          className="rounded-[20px] bg-white/85 backdrop-blur border border-[#f0ece4] p-4"
                        >
                          <Text className="text-[12px] uppercase tracking-[0.2em] text-[#9b978f]">
                            0{idx + 1}
                          </Text>
                          <Text className="serif text-[20px] mt-2 leading-[1.15]">
                            {item.title}
                          </Text>
                          <Text className="mt-2 text-[13px] leading-[1.7] text-[#6f6d67] text-pretty">
                            {item.description}
                          </Text>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="lg:col-span-5 rounded-[28px] border border-[#ece7dd] overflow-hidden bg-white min-h-[520px] flex flex-col">
                  <div className="p-6 md:p-7 border-b border-[#f2ede5] flex items-end justify-between">
                    <div>
                      <Text className="text-[12px] uppercase tracking-[0.24em] text-[#9b978f]">
                        Lookbook
                      </Text>
                      <Text className="serif text-[28px] mt-2">轮播海报</Text>
                    </div>
                    <Text className="text-[13px] text-[#6f6d67]">精选上新</Text>
                  </div>
                  <div className="flex-1 p-4 md:p-5">
                    <Carousel
                      items={heroSlides.map((item, index) => ({
                        imgSrc: [
                          "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1200&q=80",
                          "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1200&q=80",
                          "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1200&q=80",
                        ][index],
                        imgAlt: item.title,
                        title: item.title,
                        description: item.description,
                      }))}
                      slots={{
                        content: { className: "gap-4" },
                        item: {
                          className:
                            "rounded-[22px] overflow-hidden border border-[#ece7dd] bg-white shadow-[0_12px_30px_rgba(17,17,17,.04)]",
                        },
                        "item-img": {
                          className: "h-[280px] w-full object-cover hero-img",
                        },
                        "item-title": {
                          className:
                            "serif text-[24px] px-5 pt-4 leading-[1.1]",
                        },
                        "item-description": {
                          className:
                            "px-5 pb-5 pt-2 text-[14px] text-[#6f6d67] leading-[1.7] text-pretty",
                        },
                        previous: {
                          className:
                            "rounded-full border border-[#ece7dd] bg-white text-[#111111] w-10 h-10",
                        },
                        next: {
                          className:
                            "rounded-full border border-[#ece7dd] bg-white text-[#111111] w-10 h-10",
                        },
                      }}
                    />
                  </div>
                </div>
              </div>
              <div
                className="row-start-15 row-end-22 column-start-1 column-end-23 pt-4 fade-up"
                style={{ animationDelay: "160ms" }}
              >
                <div className="flex items-end justify-between mb-5">
                  <div>
                    <Text className="text-[12px] uppercase tracking-[0.24em] text-[#9b978f]">
                      New In
                    </Text>
                    <Text className="serif text-[34px] md:text-[44px] mt-2">
                      新品推荐
                    </Text>
                  </div>
                  <Text className="text-[14px] text-[#6f6d67] max-w-md text-right text-pretty">
                    以精选面料与精致裁剪，构成适合日常、出行与正式场合的核心单品。
                  </Text>
                </div>
                <div className="grid md:grid-cols-3 gap-4">
                  {newItems.map((item) => (
                    <Card
                      key={item.title}
                      imgSrc={item.imgSrc}
                      imgAlt={item.imgAlt}
                      title={item.title}
                      description={item.description}
                      buttonLabel="查看详情"
                      slots={{
                        img: {
                          className: "h-[340px] object-cover rounded-t-[16px]",
                        },
                        header: { className: "px-5 pt-5" },
                        title: {
                          className: "serif text-[24px] leading-[1.12]",
                        },
                        description: {
                          className:
                            "px-5 pt-3 text-[14px] text-[#6f6d67] leading-[1.7] text-pretty",
                        },
                        footer: { className: "px-5 pb-5 pt-5" },
                        action: {
                          className:
                            "rounded-full bg-[#111111] px-4 py-2 text-white w-full",
                        },
                      }}
                      className="rounded-[18px] border border-[#ece7dd] bg-white shadow-[0_10px_34px_rgba(17,17,17,.04)] overflow-hidden"
                    />
                  ))}
                </div>
              </div>
              <div
                className="row-start-22 row-end-29 column-start-1 column-end-23 pt-4 pb-4 fade-up"
                style={{ animationDelay: "240ms" }}
              >
                <div className="grid lg:grid-cols-12 gap-4">
                  <div className="lg:col-span-4 rounded-[28px] border border-[#ece7dd] bg-[#f7f5f0] p-7">
                    <Text className="text-[12px] uppercase tracking-[0.24em] text-[#9b978f]">
                      Style Edit
                    </Text>
                    <Text className="serif text-[34px] mt-3">穿搭专区</Text>
                    <Text className="mt-4 text-[15px] leading-[1.8] text-[#6f6d67] text-pretty">
                      用清晰的造型逻辑，帮助每一件单品在不同场景中持续发挥价值。
                    </Text>
                  </div>
                  <div className="lg:col-span-8 grid md:grid-cols-3 gap-4">
                    {stylingItems.map((item) => (
                      <div
                        key={item.title}
                        className="rounded-[22px] bg-white border border-[#ece7dd] p-6 shadow-[0_8px_28px_rgba(17,17,17,.04)]"
                      >
                        <Text className="serif text-[24px] leading-[1.12]">
                          {item.title}
                        </Text>
                        <Text className="mt-4 text-[14px] leading-[1.8] text-[#6f6d67] text-pretty">
                          {item.description}
                        </Text>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </Section>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
