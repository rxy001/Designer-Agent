<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服装电商 PC 官网首页</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4.3.0/dist/index.global.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { Text, Card, Carousel } = window;
      const frame = "w-full bg-white text-[#141413] grid grid-cols-12 gap-4 px-6 py-6 min-h-screen";
      const cardShell = "overflow-hidden rounded-[24px] border border-[#ecebe5] bg-white shadow-[0_10px_30px_rgba(0,0,0,0.04)]";
      const newItems = [
        { imgSrc: "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=900&q=80", imgAlt: "长款风衣", title: "结构感风衣", description: "轻薄垂坠，适合早春与换季时刻。", content: "精选灰米色系，保持视觉克制与高级。" },
        { imgSrc: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80", imgAlt: "针织套装", title: "精纺针织套装", description: "松弛但有轮廓，适合日常与轻社交。", content: "柔软贴身的表面肌理，突出材质质感。" },
        { imgSrc: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80", imgAlt: "简约衬衫", title: "极简衬衫", description: "留白式版型，提升整体搭配完成度。", content: "单穿或叠搭都能维持利落气质。" },
      ];
      const stylingSets = [
        { title: "通勤套组", description: "衬衫、直筒下装与短外套，建立秩序感层次。", content: "强调比例修长、线条干净、细节克制。" },
        { title: "周末松弛", description: "针织、宽裤与轻外套，呈现自然的舒适状态。", content: "适合出行、咖啡馆与轻度社交场景。" },
        { title: "晚间质感", description: "深色单品与低饱和配饰，营造更安静的存在感。", content: "通过材质对比提升整体辨识度。" },
      ];

      function App() {
        return (
          <Text className={frame}>
            <Text className="col-start-1 col-end-4 text-sm tracking-[0.22em] uppercase text-[#87867f] text-wrap-pretty">Maison Atelier</Text>
            <Text className="col-start-4 col-end-10 text-sm text-[#5e5d59] text-wrap-pretty">首页 · 新品 · 女装 · 男装 · 穿搭专区 · 品牌故事</Text>
            <Text className="col-start-11 col-end-13 justify-self-end rounded-full bg-[#141413] px-5 py-3 text-sm text-white text-wrap-pretty">立即选购</Text>

            <Text className="col-start-1 col-end-8 row-start-2 row-end-6 pt-6 px-2 text-6xl leading-[1.05] tracking-[-0.03em] text-[#141413] text-wrap-pretty">极简轻奢，<br />以版型与质感定义日常。</Text>
            <Text className="col-start-1 col-end-6 row-start-6 row-end-8 px-2 text-lg leading-8 text-[#5e5d59] text-wrap-pretty">纯白背景、精致排版与大气留白，聚焦服装本身的轮廓、面料和穿着场景。</Text>
            <Text className="col-start-1 col-end-3 row-start-8 row-end-9 rounded-full bg-[#141413] px-6 py-3 text-sm text-white text-wrap-pretty">浏览新品</Text>
            <Text className="col-start-3 col-end-5 row-start-8 row-end-9 rounded-full bg-[#f3f3ef] px-6 py-3 text-sm text-[#141413] text-wrap-pretty">查看穿搭</Text>

            <Carousel
              className="col-start-6 col-end-13 row-start-2 row-end-9"
              items={[
                { imgSrc: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1400&q=80", imgAlt: "轻奢成衣海报", title: "2026 春夏新章", description: "利落廓形、柔和面料与克制细节，构成更安静的高级感。" },
                { imgSrc: "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1400&q=80", imgAlt: "品牌穿搭海报", title: "都市通勤胶囊衣橱", description: "一衣多穿的结构化搭配，让日常穿着更从容。" },
                { imgSrc: "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1400&q=80", imgAlt: "新品推荐海报", title: "精选上新", description: "以面料触感、比例和剪裁为核心，建立干净的产品秩序。" },
              ]}
              slots={{
                content: { className: "h-full overflow-hidden rounded-[28px] border border-[#ecebe5] bg-[#fafafa] shadow-[0_18px_40px_rgba(0,0,0,0.06)]" },
                item: { className: "h-full" },
                "item-img": { className: "h-[28rem] w-full object-cover" },
                "item-title": { className: "px-8 pt-7 text-2xl font-medium leading-tight text-[#141413] text-wrap-pretty" },
                "item-description": { className: "px-8 pb-8 pt-3 text-sm leading-7 text-[#5e5d59] text-wrap-pretty" },
                previous: { className: "absolute left-6 top-1/2 -translate-y-1/2 rounded-full border border-[#e5e4df] bg-white/90 px-4 py-3 text-sm text-[#141413] shadow-none backdrop-blur hover:bg-white" },
                next: { className: "absolute right-6 top-1/2 -translate-y-1/2 rounded-full border border-[#e5e4df] bg-white/90 px-4 py-3 text-sm text-[#141413] shadow-none backdrop-blur hover:bg-white" },
              }}
            />

            <Text className="col-start-1 col-end-4 row-start-10 text-sm tracking-[0.24em] uppercase text-[#87867f]">新品推荐</Text>
            <Text className="col-start-1 col-end-5 row-start-11 text-4xl leading-tight text-[#141413] text-wrap-pretty">选品更少，<br />质感更明显。</Text>
            <Text className="col-start-1 col-end-5 row-start-12 text-base leading-7 text-[#5e5d59] text-wrap-pretty">以可持续穿着频率为标准，只保留适合长期搭配的核心单品。</Text>

            <Card className={`${cardShell} col-start-5 col-end-8 row-start-10 row-end-16`} imgSrc={newItems[0].imgSrc} imgAlt={newItems[0].imgAlt} title={newItems[0].title} description={newItems[0].description} content={newItems[0].content} slots={{ img: { className: "h-72 w-full object-cover" }, header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />
            <Card className={`${cardShell} col-start-8 col-end-11 row-start-10 row-end-16`} imgSrc={newItems[1].imgSrc} imgAlt={newItems[1].imgAlt} title={newItems[1].title} description={newItems[1].description} content={newItems[1].content} slots={{ img: { className: "h-72 w-full object-cover" }, header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />
            <Card className={`${cardShell} col-start-11 col-end-13 row-start-10 row-end-16 mr-2`} imgSrc={newItems[2].imgSrc} imgAlt={newItems[2].imgAlt} title={newItems[2].title} description={newItems[2].description} content={newItems[2].content} slots={{ img: { className: "h-72 w-full object-cover" }, header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />

            <Text className="col-start-1 col-end-4 row-start-17 text-sm tracking-[0.24em] uppercase text-[#87867f]">穿搭专区</Text>
            <Text className="col-start-1 col-end-5 row-start-18 text-4xl leading-tight text-[#141413] text-wrap-pretty">用搭配，<br />讲清风格。</Text>
            <Text className="col-start-1 col-end-5 row-start-19 text-base leading-7 text-[#5e5d59] text-wrap-pretty">从通勤、周末到夜晚，按场景整理完整穿搭，减少选择成本。</Text>

            <Card className="col-start-5 col-end-7 row-start-17 row-end-23 rounded-[24px] border border-[#ecebe5] bg-[#fcfcfb] shadow-none" title={stylingSets[0].title} description={stylingSets[0].description} content={stylingSets[0].content} slots={{ header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />
            <Card className="col-start-7 col-end-9 row-start-17 row-end-23 rounded-[24px] border border-[#ecebe5] bg-[#fcfcfb] shadow-none" title={stylingSets[1].title} description={stylingSets[1].description} content={stylingSets[1].content} slots={{ header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />
            <Card className="col-start-9 col-end-11 row-start-17 row-end-23 rounded-[24px] border border-[#ecebe5] bg-[#fcfcfb] shadow-none" title={stylingSets[2].title} description={stylingSets[2].description} content={stylingSets[2].content} slots={{ header: { className: "px-6 pt-6" }, title: { className: "text-xl font-medium leading-tight text-[#141413] text-wrap-pretty" }, description: { className: "pt-3 text-sm leading-6 text-[#5e5d59] text-wrap-pretty" }, content: { className: "px-6 pb-6 pt-4 text-sm leading-6 text-[#87867f] text-wrap-pretty" } }} />

            <Text className="col-start-1 col-end-9 row-start-24 pb-6 text-sm text-[#87867f] text-wrap-pretty">精简单品、完整搭配、优雅留白，让首页更像一本时装画册。</Text>
          </Text>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
